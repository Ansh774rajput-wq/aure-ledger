name: Scheduled Database Backup (Neon Free)

on:
  schedule:
    # Runs daily at 02:00 UTC (07:30 IST)
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allows manual backup trigger with 1 click from GitHub Actions UI

concurrency:
  group: neon-database-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Neon PostgreSQL Backup & Retention
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL 17 Client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lsb-release curl ca-certificates gnupg
          sudo install -d /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/keyrings/postgresql.gpg
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Run Secret-Safe Backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not configured in GitHub repository secrets!"
            exit 1
          fi

          # Mask database credentials in GitHub Actions logs
          echo "::add-mask::$DATABASE_URL"

          TIMESTAMP=$(date -u +"%Y%m%d_%H%M%SZ")
          BACKUP_DIR="backups"
          BACKUP_FILE="${BACKUP_DIR}/aure_ledger_${TIMESTAMP}.dump"

          mkdir -p "${BACKUP_DIR}"
          chmod 700 "${BACKUP_DIR}"

          echo "Starting Neon PostgreSQL backup to ${BACKUP_FILE}..."
          pg_dump "${DATABASE_URL}" \
            --format=custom \
            --no-owner \
            --no-privileges \
            --file="${BACKUP_FILE}"

          chmod 600 "${BACKUP_FILE}"
          FILE_SIZE=$(du -h "${BACKUP_FILE}" | cut -f1)
          echo "Backup created successfully: ${BACKUP_FILE} (${FILE_SIZE})"
          echo "BACKUP_FILE=${BACKUP_FILE}" >> $GITHUB_ENV
          echo "TIMESTAMP=${TIMESTAMP}" >> $GITHUB_ENV

      - name: Upload Secure Backup Artifact (90-Day Free Retention)
        uses: actions/upload-artifact@v4
        with:
          name: aure-ledger-backup-${{ env.TIMESTAMP }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 90
          if-no-files-found: error
